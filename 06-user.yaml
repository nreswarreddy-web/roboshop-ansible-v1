- name: working on user
  hosts: user
  become: yes
  tasks:
  - name: disable node js 
    command: dnf module disable nodejs -y
  
  - name: enable node js
    dnf:
     name: nodejs
     state: present 
    
  - name: creating application user 
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin 
      comment: "roboshop system user"

  - name: remove exite app directory
    file:
     path: /app
     state: absent
  
  - name: remove user.zip
    file:
     path: /tmp/user.zip
     state: absent
 
  - name: crete app directory
    file: 
     path: /app
     state: directory

  - name: download the files
    get_url:
     url:  https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
     dest: /tmp/user.zip

  - name: unzip user
    unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes 

  - name: Install bottle python package
    community.general.npm:
      path: /app

  - name: copy user services 
    template:
     src: user.service.j2
     dest: /etc/systemd/system/user.service



  - name: demon load
    systemd_service:
     daemon_reload: true

  - name: start and enable user
    service:
     name: user
     state: restarted
     enabled: yes 