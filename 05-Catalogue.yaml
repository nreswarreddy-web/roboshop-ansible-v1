- name: working on Catalogue
  hosts: Catalogue
  become: yes
  tasks:
  - name: disable node js 
    command: dnf module disable nodejs -y
  
  - name: enable node js
    dnf:
     name: nodejs
     state: present 
    
  - name: creating application user 
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin 
      comment: "roboshop system user"

  - name: remove exite app directory
    file:
     path: /app
     state: absent
  
  - name: remove catalogue.zip
    file:
     path: /tmp/catalogue.zip
     state: absent
 
  - name: crete app directory
    file: 
     path: /app
     state: directory

  - name: download the files
    get_url:
     url:  https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
     dest: /tmp/catalogue.zip

  - name: unzip catalogue
    unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes 

  - name: Install bottle python package
    community.general.npm:
      path: /app

  - name: copy catalogue services 
    template:
     src: catalogue.service.j2
     dest: /etc/systemd/system/catalogue.service

  - name: copy mongo repo
    copy: 
     src: mongo.repo
     dest: /etc/yum.repos.d/mongo.repo
    
  - name: install mongo client
    dnf:
     name: mongodb-mongosh
     state: present

  - name: check product is loaded or not
    command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
    register: product_count

  - name: print product count
    debug:
     msg: "{{ product_count }}"