- name: working on Catalogue
  hosts: Catalogue
  become: yes
  task:
  - name: disable node js 
    command: dnf module disable nodejs -y
  
  - name: enable node js
    dnf:
     name: nodejs
     state: present 
    
  - name: creating application user 
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin 
      comment: "roboshop system user"
