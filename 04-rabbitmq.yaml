- name: rabbit mq server 
  hosts: rabbitmq
  become: yes
  tasks:
  - name: copy rabbit mq 
    copy: 
      src: rabbitmq.repo
      dest: /etc/yum.repos.d/rabbitmq.repo

  - name: install rabbit mq
    dnf:
      name:
      - erlang 
      - rabbitmq-server
      state: present

  - name: start and enable rabbit mq sever
    service: 
     name: rabbitmq-server
     state: started
     enabled: yes 

  - name: create rabbit mq
    community.rabbitmq.rabbitmq_user:
     user: roboshop
     password: roboshop123
     vhost: /
     configure_priv: .*
     read_priv: .*
     write_priv: .*
     state: present

