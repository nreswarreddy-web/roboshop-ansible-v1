- name: configure shipping sever
  hosts: shipping
  become: yes
  tasks:
  - name: enable maven 3.9
    command: dnf module enable maven:3.9 -y
  
  - name: install maven
    dnf:
      name:
      - maven 
      - java-25-openjdk-devel
      - maven-openjdk25
      - mysql
      state: present
     

 # - name: find java25 path
 #   shell: readlink -f $(ls /usr/lib/jvm/java-25-openjdk/bin/java | head -1)
 #   register: java25

#- name: print the output
#    debug: 
#     msg: "{{ java25 }}"

#  - name: make java25 as default
#    command: alternatives --config java "{{ java25 }}"

  - name: creating application user 
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin 
      comment: "roboshop system user"

  - name: remove exite app directory
    file:
      path: /app
      state: absent
  
  - name: remove shipping.zip
    file:
     path: /tmp/shipping.zip
     state: absent
 
  - name: crete app directory
    file: 
     path: /app
     state: directory

  - name: download the files
    get_url:
     url:  https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
     dest: /tmp/shipping.zip

  - name: unzip shipping
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes 