- name: create a instances and s53
  hosts: local
  connection: local
  tasks:
  vars:
   instances: [ "mongodb" ,"redis", "mysql", "rabbitmq" ]
   action: create
   domain_name: daw92ss.store
   ami_id: ami-0055977a6e828a4f4
   instance_type: t3.micro 
  tasks:
  - name: create a ec2 instances
    amazon.aws.ec2_instance:
       name: "roboshop-{{ item }}"
       image_id: "{{ ami_id }}"
       instance_type: "{{ instance_type }}"
       security_group:
       - roboshop-common
       - "roboshop-{{ item }}"
       region: us-east-1
    loop: "{{ instances }}"
    when: action ==  "create"
    register: ec2_output
    


     
