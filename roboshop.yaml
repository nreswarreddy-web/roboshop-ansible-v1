- name: create instance and s53
  hosts: local
  connection: local
  vars:
    instances: ["mongodb" ,"redis", "mysql", "rabbitmq"]
    action: create
    domain_name: daw92ss.store
    ami_id: ami-0055977a6e828a4f4
     
  tasks:
  - name: create  ec2 instances
    amazon.aws.ec2_instance:
        name: "roboshop_{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
        - roboshop-common
        - "roboshop_{{ item }}"
        region: us-east-1
    loop: "{{ instances }}"
    when: action ==  "create"
    register: ec2_output