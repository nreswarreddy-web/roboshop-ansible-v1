- name: create instance and s53
  hosts: local
  connection: local
  vars:
    instances: ["mongodb" ,"redis", "mysql", "rabbitmq"]
    action: create
    domain_name: daw92ss.store
    ami_id: ami-0055977a6e828a4f4
     
  tasks:
  - name: create  ec2 instances
    amazon.aws.ec2_instance:
        name: "roboshop_{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
        - roboshop-common
        - "roboshop_{{ item }}"
        region: us-east-1
    loop: "{{ instances }}"
    when: action ==  "create"
    register: ec2_output
 # - name: print ec2 creation output
 #   debug:
 #    msg: "{{ec2_output}}"

  - name: create R53 record
    amazon.aws.route53:
    state: present 
    zone: "{{ domain_name }}"
    record: "{{ item.item }}.{{domain_name}}" # mongodb.daw92ss.store
    type: A 
    ttl: 1
    value: "{{ item.instance[0].private_ip_address }}"
    overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"
